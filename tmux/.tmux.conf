set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'tmux-plugins/tmux-yank'

# resize panes using arrow keys 
bind Left resize-pane -L 5
bind Down resize-pane -D 5
bind Up resize-pane -U 5
bind Right resize-pane -R 5

# Window numbering starts at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Truecolor. tmux-256color advertises the right capabilities (italics, more
# colour pairs); the RGB override tells tmux the outer terminal is 24-bit, so
# themes render as designed instead of being quantised to 256.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:RGB"

# Required by `theme`: it2setcolor recolours iTerm2 with an OSC 1337 sequence,
# which tmux only forwards to the outer terminal when passthrough is enabled.
set -g allow-passthrough on

# Required for vim to notice theme changes (FocusGained) -- and for checktime
# to catch files edited underneath it.
set -g focus-events on

# The 2000-line default is about one agent build log. Costs memory only for
# panes that actually fill it.
set -g history-limit 50000

# mouse scrolling
set -g mouse on

set -s set-clipboard on


# reload configuration
bind r source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'


# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l


# Colours for status bar, panes and messages, generated by `theme`.
# -q so a fresh machine without a theme installed still loads this config.
source-file -q ~/.config/theme/current/tmux.conf

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

